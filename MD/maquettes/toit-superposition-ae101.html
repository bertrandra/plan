<title>Corps superposés</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Concept : les corps de toit se superposent librement ; le plus haut l'emporte, les noues et les arêtes naissent de l'union.
   La façade n'est plus un dessin à plat mais la même scène 3D vue en projection oblique : les recouvrements, noues et pénétrations
   y sont justes. Départ : AE 101, un retour qui traverse le toit, un bow-window d'exemple. Jetons de src/styles/jetons.ts. */
:root{
  --ink:#2B2117; --ink-soft:#6B5A41; --paper:#F7F2E7; --paper-deep:#EFE8D8;
  --stage:#F1EBDC; --panel:#FFFDF8; --panel-2:#F7F2E7; --border:#E4D9C1; --rule:#D9CDB2; --hairline:#EFE6D3;
  --accent:#7A5C31; --on-accent:#FFFDF8; --accent-light:#EFE3C8; --on-accent-light:#5E4623;
  --on-ink:#FFFDF8; --danger:#8E2A1C; --ombre:0 1px 3px rgba(59,46,31,.14); --ombre-menu:0 4px 12px rgba(59,46,31,.2);
  /* le bâtiment : couleurs du projet (murs, toits), pas de l'interface */
  --wall:#EADFC6; --wall-side:#D3C4A2; --roof:#B0654A; --roof-dk:#8C4B36; --roof-lt:#C47D5E;
  --glass:#A9BFC9; --door:#6B5A41; --ground:#D4CDA6; --edge:rgba(43,33,23,.38);
  --el-front:#F3EBDA; --el-side:#D9CCAF; --el-top:#C9BB99; --solar:#3E5F7A; --post:#8A7658;
  --r-champ:10px; --r-bouton:12px; --r-tuile:14px; --r-panneau:16px;
  --sans:"Helvetica Neue",Arial,system-ui,sans-serif; --serif:Georgia,"Iowan Old Style",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ink:#F1E7D0; --ink-soft:#BFAE8C; --paper:#1C1610; --paper-deep:#231C14;
  --stage:#1C1610; --panel:#262017; --panel-2:#2F271C; --border:#3E3325; --rule:#4A3F30; --hairline:#332A1F;
  --accent:#E0B564; --on-accent:#1C1610; --accent-light:#4A3B22; --on-accent-light:#F1D9A6;
  --on-ink:#1C1610; --danger:#F2A493; --ombre:0 1px 3px rgba(0,0,0,.4); --ombre-menu:0 4px 12px rgba(0,0,0,.5);
  --wall:#6B5C45; --wall-side:#54473A; --roof:#9A5640; --roof-dk:#763F2E; --roof-lt:#B26A50;
  --glass:#5F7A88; --door:#2F271C; --ground:#2B2A1C; --edge:rgba(241,231,208,.3);
  --el-front:#8A7A5E; --el-side:#6A5C45; --el-top:#5A4D3A; --solar:#4F7FA6; --post:#B79F78; color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#F1E7D0; --ink-soft:#BFAE8C; --paper:#1C1610; --paper-deep:#231C14;
  --stage:#1C1610; --panel:#262017; --panel-2:#2F271C; --border:#3E3325; --rule:#4A3F30; --hairline:#332A1F;
  --accent:#E0B564; --on-accent:#1C1610; --accent-light:#4A3B22; --on-accent-light:#F1D9A6;
  --on-ink:#1C1610; --danger:#F2A493; --ombre:0 1px 3px rgba(0,0,0,.4); --ombre-menu:0 4px 12px rgba(0,0,0,.5);
  --wall:#6B5C45; --wall-side:#54473A; --roof:#9A5640; --roof-dk:#763F2E; --roof-lt:#B26A50;
  --glass:#5F7A88; --door:#2F271C; --ground:#2B2A1C; --edge:rgba(241,231,208,.3);
  --el-front:#8A7A5E; --el-side:#6A5C45; --el-top:#5A4D3A; --solar:#4F7FA6; --post:#B79F78; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.3 var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-tap-highlight-color:transparent}
svg{display:block}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;gap:10px;grid-template-rows:auto minmax(0,1fr) auto;padding-block:8px}
.bar{display:flex;align-items:center;gap:6px}
.bar h1{margin:0 auto 0 4px;font:600 1.05rem/1 var(--serif);display:flex;align-items:center;gap:8px;min-width:0}
.bar h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:var(--r-bouton);border:1px solid var(--rule);background:var(--panel);
  display:grid;place-items:center;box-shadow:var(--ombre);padding:0}
.ib:hover:not(:disabled){background:var(--accent-light);color:var(--on-accent-light)}
.ib:disabled{opacity:.38;cursor:default}
.sep{width:1px;height:26px;background:var(--rule);margin:0 2px}

.scene{position:relative;min-height:0;border:1px solid var(--border);border-radius:var(--r-panneau);overflow:hidden;
  background:var(--stage);box-shadow:var(--ombre)}
.scene svg#svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#svg polygon{stroke:var(--edge);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#svg .sol{fill:var(--ground);stroke:none}
#svg .sol2{stroke:var(--rule);stroke-width:1px;fill:none}
.fa{fill:var(--roof)} .fb{fill:var(--roof-dk)} .fc{fill:var(--wall-side)} .fd{fill:var(--roof-lt)}
.wl{fill:var(--wall)} .ws{fill:var(--wall-side)} .gl{fill:var(--glass)} .dr{fill:var(--door)}
.sh{fill:var(--ink);fill-opacity:.16;stroke:none}
.po{fill:var(--post)}
.ef{fill:var(--el-front)} .es{fill:var(--el-side)} .et{fill:var(--el-top)} .er{fill:var(--roof-dk)} .eg{fill:var(--glass)} .ep{fill:var(--solar)}
.zone{cursor:pointer;outline:none}
.zone:hover .body polygon{filter:brightness(1.06)}
.zone.sel .body polygon{stroke:var(--accent);stroke-width:2px}
.zone.cible .body polygon{stroke:var(--accent);stroke-width:3px;filter:brightness(1.12)}
.el,.it{cursor:grab}
.el:hover polygon,.it:hover polygon{filter:brightness(1.1)}
.el.sel polygon,.it.sel polygon{stroke:var(--accent);stroke-width:2.5px}
.it.sel .sh{stroke:none}
.hdl{cursor:pointer}
.hdl .hc{fill:var(--panel);stroke:var(--accent);stroke-width:2px;vector-effect:non-scaling-stroke}
.hdl .hp{fill:none;stroke:var(--accent);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round}
.hdl:hover .hc{fill:var(--accent-light)}
.hdl .hz{fill:transparent;stroke:none}
.later{opacity:.3}
.scene canvas#cv-face{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#svg3 .pr{fill-opacity:.7}
#svg3 .zp:hover .pr{fill-opacity:.85}
.dev{position:absolute;left:10px;right:10px;bottom:8px;height:50px;z-index:3;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-tuile);box-shadow:var(--ombre);overflow:hidden}
.dev svg{display:block;width:100%;height:100%}
.dev .dz{fill:var(--wall);stroke:var(--edge);stroke-width:1px;cursor:pointer}
.dev .dz.on{stroke:var(--accent);stroke-width:2px;fill:var(--accent-light)}
.dev .dz:hover{filter:brightness(1.08)}
.dev .dm{fill:var(--roof);stroke:var(--edge);stroke-width:1px;cursor:pointer}
.dev .dg{fill:var(--post);fill-opacity:.55;stroke:var(--post);stroke-width:1px;cursor:pointer}
.dev .db{fill:var(--wall-side);stroke:var(--roof-dk);stroke-width:1px;cursor:pointer}
.dev .de{fill:var(--el-top);stroke:var(--edge);stroke-width:1px;cursor:pointer}
.dev .on{stroke:var(--accent);stroke-width:2.5px}
.dev text{font:600 10px var(--sans);fill:var(--ink-soft);pointer-events:none;font-variant-numeric:tabular-nums}
#svg3 .pb{fill:var(--wall-side);fill-opacity:.8;stroke:var(--roof-dk);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#svg3 .pit.sel .pb{stroke:var(--accent);stroke-width:2.5px}
.scene svg#svg3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#svg3 .gr{stroke:var(--hairline);stroke-width:1px;vector-effect:non-scaling-stroke}
#svg3 .av{stroke:var(--rule);stroke-width:2px;vector-effect:non-scaling-stroke}
#svg3 .pr{fill:var(--wall);stroke:var(--edge);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#svg3 .pl{fill:none;stroke:var(--roof);stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linecap:round}
#svg3 .pi{fill:var(--wall-side);fill-opacity:.75;stroke:var(--roof-dk);stroke-width:1.5px;stroke-dasharray:5 3;vector-effect:non-scaling-stroke}
#svg3 .pa{fill:var(--post);fill-opacity:.35;stroke:var(--post);stroke-width:1.5px;vector-effect:non-scaling-stroke}
#svg3 .pd{fill:var(--accent);stroke:none}
#svg3 .pn{font:600 .62px var(--sans);fill:var(--ink-soft);pointer-events:none}
#svg3 .zp{cursor:grab}
#svg3 .zp:hover .pr{filter:brightness(1.06)}
#svg3 .zp.sel .pr{stroke:var(--accent);stroke-width:2.5px}
#svg3 .pit{cursor:pointer}
#svg3 .pit.sel .pi,#svg3 .pit.sel .pa{stroke:var(--accent);stroke-width:2.5px}
#svg2 polygon{stroke:var(--edge);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#svg2 .sol{fill:var(--ground);stroke:none}
#svg2 .cr{fill:none;stroke:var(--roof);stroke-width:7px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.scene svg#svg2{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.seg3d.gauche{right:auto;left:10px}
.panel{display:flex;flex-direction:column;gap:8px}
.seq{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity}
.step{position:relative;flex:0 0 70px;height:60px;border-radius:var(--r-tuile);border:1px solid var(--border);background:var(--panel-2);padding:5px;display:grid;place-items:center;scroll-snap-align:start}
.step svg{width:100%;height:100%;pointer-events:none}
.step b{position:absolute;left:6px;top:3px;font-size:.62rem;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.step:hover{background:var(--accent-light)}
.step.on{border:2px solid var(--accent);background:var(--accent-light);padding:4px}
.step.plus{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.step.plus svg{width:26px;height:26px}
.cat{position:fixed;inset:0;z-index:30;background:rgba(20,14,8,.5);display:grid;align-items:end}
.cat .sheet2{background:var(--panel);border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:82%;overflow:auto;display:flex;flex-direction:column;gap:12px;box-shadow:var(--ombre-menu)}
.cat h2{margin:0;font:600 .64rem var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.cat .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:6px}
.cat .head{display:flex;align-items:center;justify-content:space-between}
@media (min-width:700px){.cat{align-items:center;justify-items:center}.cat .sheet2{width:min(600px,92vw);border-radius:var(--r-panneau)}}
@media (min-width:1024px){.seq{flex-wrap:wrap;overflow:visible}}
.guide{stroke:var(--accent);stroke-width:1.5px;stroke-dasharray:5 4;vector-effect:non-scaling-stroke;fill:none}

.chip,.ctx{position:absolute;z-index:3;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--rule);
  border-radius:999px;box-shadow:var(--ombre-menu);padding:3px}
.chip{pointer-events:none;gap:12px;padding:6px 12px;font-variant-numeric:tabular-nums;font-size:.8rem;color:var(--ink-soft)}
.chip b{display:flex;align-items:center;gap:5px;font-weight:600;color:var(--ink)}
.chip .i{width:16px;height:16px;color:var(--accent)}
.ctx button{width:40px;height:40px;border-radius:999px;border:0;background:transparent;display:grid;place-items:center;padding:0}
.ctx button:hover{background:var(--accent-light);color:var(--on-accent-light)}
.ctx button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.ctx button.danger{color:var(--danger)}
.ctx output{min-width:42px;text-align:center;font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.ctx .sep{margin:0 3px}

.hint{position:absolute;z-index:2;width:56px;height:56px;margin:-28px 0 0 -28px;pointer-events:none;display:grid;place-items:center;color:var(--on-accent)}
.hint::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent);opacity:.88}
.hint::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:onde 1.8s ease-out infinite}
.hint .i{position:relative;width:28px;height:28px}
@keyframes onde{from{transform:scale(.7);opacity:.9}to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.hint::after{animation:none;opacity:.6}}

.tray{background:var(--panel);border:1px solid var(--border);border-radius:var(--r-panneau);box-shadow:var(--ombre);
  padding:8px;display:flex;flex-direction:column;gap:8px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--stage);padding:3px;border-radius:var(--r-bouton)}
.tabs button{height:40px;border:0;border-radius:calc(var(--r-bouton) - 3px);background:transparent;display:flex;
  align-items:center;justify-content:center;gap:6px;font-size:.74rem;color:var(--ink-soft);min-width:0}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.cards{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
.card{flex:0 0 92px;height:92px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 5px;border-radius:var(--r-tuile);
  border:1px solid var(--border);background:var(--panel-2);scroll-snap-align:start;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.card svg{flex:1;min-height:0;width:100%;pointer-events:none}
.card span{font-size:.64rem;color:var(--ink-soft);white-space:nowrap}
.card:hover:not(:disabled){border-color:var(--rule);background:var(--accent-light)}
.card:disabled{opacity:.4;cursor:default}
.card[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-light);padding:5px 3px 4px}
.card[aria-pressed="true"] span{color:var(--on-accent-light);font-weight:600}
.cards.grand .card{flex-basis:132px;height:112px}
.ghost{position:fixed;z-index:20;pointer-events:none;width:92px;height:80px;margin:-40px 0 0 -46px;border-radius:var(--r-tuile);
  background:var(--panel);border:2px solid var(--accent);box-shadow:var(--ombre-menu);opacity:.94;padding:4px}
.ghost svg{width:100%;height:100%}

.ib.ok{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.ib.ok:hover:not(:disabled){background:var(--accent);color:var(--on-accent);filter:brightness(1.1)}
/* un écran à la fois : data-view = a (3D du terrain), b (façade), c (vignette en grand) */
.vue3d{position:relative;min-height:0;border:1px solid var(--border);border-radius:var(--r-panneau);overflow:hidden;background:var(--stage);box-shadow:var(--ombre)}
.vue3d canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.app[data-view="a"] .scene,.app[data-view="a"] .tray,.app[data-view="c"] .scene,.app[data-view="c"] .tray{display:none}
.app[data-view="b"] .vue3d{display:none}
.app[data-view="a"],.app[data-view="c"]{grid-template-rows:auto minmax(0,1fr)}
.app[data-view="a"] #b-retour,.app[data-view="a"] #b-undo,.app[data-view="a"] #b-redo,.app[data-view="a"] #b-reset,.app[data-view="a"] #b-ok,
.app[data-view="c"] #b-undo,.app[data-view="c"] #b-redo,.app[data-view="c"] #b-reset,.app[data-view="c"] #b-ok,.app[data-view="c"] #b-theme,.app[data-view="c"] #sep-theme,
.app[data-view="b"] #b-theme,.app[data-view="b"] #sep-theme{display:none}
.seg3d{position:absolute;top:10px;right:10px;z-index:3;display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:3px;box-shadow:var(--ombre-menu)}
.seg3d button{width:44px;height:44px;border:0;border-radius:999px;background:transparent;display:grid;place-items:center;padding:0}
.seg3d button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.abar{position:absolute;left:0;right:0;bottom:14px;z-index:3;display:flex;justify-content:center;pointer-events:none}
.abar button{pointer-events:auto;height:52px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);
  display:flex;align-items:center;gap:10px;font-size:.95rem;font-weight:600;box-shadow:var(--ombre-menu)}
.abar button:disabled{background:var(--panel);color:var(--ink-soft);border:1px solid var(--rule)}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-radius:999px;background:var(--ink);color:var(--on-ink);box-shadow:var(--ombre-menu);font-size:.85rem}
.mini{position:absolute;top:10px;right:10px;z-index:4;width:clamp(128px,34%,230px);aspect-ratio:4/3;border-radius:var(--r-tuile);overflow:hidden;
  border:2px solid var(--accent);box-shadow:var(--ombre-menu);background:var(--stage);padding:0;touch-action:manipulation;cursor:pointer}
.mini canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.mini .badge{position:absolute;right:6px;bottom:6px;width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--rule);display:grid;place-items:center;color:var(--ink)}
.mini .badge .i{width:16px;height:16px}
.dlg{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:rgba(20,14,8,.5);padding:16px}
.dlg .sheet{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panneau);padding:18px;display:flex;flex-direction:column;gap:14px;max-width:360px;width:100%;box-shadow:var(--ombre-menu)}
.dlg p{margin:0;font:600 1.05rem/1.25 var(--serif)}
.dlg .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlg .big{height:56px;border-radius:var(--r-bouton);border:1px solid var(--rule);background:var(--panel-2);display:flex;align-items:center;justify-content:center;gap:8px}
.dlg .big.danger{color:var(--danger)}
@media (min-width:1024px){
  .app[data-view="a"],.app[data-view="c"]{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .vue3d{grid-row:2;grid-column:1 / -1}
  .app{grid-template-columns:minmax(0,1fr) 372px;grid-template-rows:auto minmax(0,1fr)}
  .bar{grid-column:1 / -1}
  .tray{grid-row:2;grid-column:2;overflow:auto}
  .scene{grid-row:2;grid-column:1}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;padding:2px}
  .card,.cards.grand .card{flex:none;height:104px;touch-action:none}
  .cards.grand{grid-template-columns:repeat(2,1fr)}
  .cards.grand .card{height:132px}
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';
/* ---------- projection oblique : x vers la droite, y vers le haut, z vers le fond (z < 0 : devant la façade) ---------- */
const K=.38, M=.22, X0=.8, LARGEUR_MAX=17.2, PROF_MAX=12;
let ACC=null, SINK=null; // SINK : recueille les faces pour la 3D au lieu de dessiner
const P=(x,y,z)=>[x+K*z,-(y+M*z)];
// le corps en cours de dessin : decale en profondeur (z0) ou tourne d'un quart de tour (dir z, faitage vers le fond).
// Le dessin d'un corps se fait toujours dans son repere propre (faitage selon x, face vers z=0) ; worldPt le pose dans le monde.
// Le quart de tour est une symetrie : les faces visibles du repere propre restent les faces visibles du monde.
let CUR=null;
const setCtx=z=>{CUR=z;};
function worldPt(p){
  const c=CUR;if(!c)return p;
  if(c.dir==='z'){const a=p[0]-c._x,b=p[2];return[c.x+c.w-b,p[1],c.z0+c.d-a];}
  return c.z0?[p[0],p[1],p[2]+c.z0]:p;
}
const PW=(x,y,z)=>{const w=worldPt([x,y,z]);return P(w[0],w[1],w[2]);};
const zoneLocal=z=>z.dir==='z'?Object.assign({},z,{w:z.d,d:z.w}):z;
const libre=()=>true; // les corps de toit se superposent : le plus haut l'emporte
const minW=z=>Math.max(2.5,...z.pig.map(q=>q.x+q.w),...z.app.map(q=>q.x0+1.2),...z.bow.map(q=>q.x+q.w));
const f2=n=>n.toFixed(3);
function poly(pts,cls){
  if(SINK){SINK.push({p:pts.map(worldPt),c:cls});return '';}
  const q=pts.map(p=>{const w=worldPt(p);return P(w[0],w[1],w[2]);});
  if(ACC) q.forEach(a=>ACC.push(a));
  return '<polygon class="'+cls+'" points="'+q.map(a=>f2(a[0])+','+f2(a[1])).join(' ')+'"/>';
}
const sh=(pts,dx)=>pts.map(p=>[p[0]+dx,p[1],p[2]]);
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fr=n=>n.toFixed(1).replace('.',',');
const deg=r=>Math.round(r*180/Math.PI);

/* ---------- les formes du toit principal ----------
   prof : le profil du pan de façade (z de 0 au faîtage), là où un pignon traversant vient le couper. */
const SHAPES={
  'plat':{nom:'Plat',h0:.35,hr:null,mur:e=>e,
    faces:(W,D,e)=>{const p=.35;return[
      [[[0,e+p,0],[W,e+p,0],[W,e+p,D],[0,e+p,D]],'fd'],
      [[[W,e,0],[W,e,D],[W,e+p,D],[W,e+p,0]],'fc'],
      [[[0,e,0],[W,e,0],[W,e+p,0],[0,e+p,0]],'fc']];},
    place:(W,D,e)=>({z0:.5,z1:D-.5,y:()=>e+.35,xr:()=>[0,W]}),top:()=>null,prof:null},
  'appentis':{nom:'Un pan',h0:1.3,hr:[.4,3.2],mur:e=>e,
    faces:(W,D,e,h)=>[
      [[[W,e,0],[W,e,D],[W,e+h,D]],'fc'],
      [[[0,e,0],[W,e,0],[W,e+h,D],[0,e+h,D]],'fa']],
    place:(W,D,e,h)=>({z0:0,z1:D,y:z=>e+h*z/D,xr:()=>[0,W]}),top:(W,D,e,h)=>[W/2,e+h,D],
    prof:(W,D,e,h)=>({zr:D,y:z=>e+h*z/D})},
  'deux-pans':{nom:'Deux pans',h0:2.9,hr:[.8,4],mur:e=>e,
    faces:(W,D,e,h)=>[
      [[[W,e,0],[W,e,D],[W,e+h,D/2]],'fc'],
      [[[0,e,0],[W,e,0],[W,e+h,D/2],[0,e+h,D/2]],'fa']],
    place:(W,D,e,h)=>({z0:0,z1:D/2,y:z=>e+h*z/(D/2),xr:()=>[0,W]}),top:(W,D,e,h)=>[W/2,e+h,D/2],
    prof:(W,D,e,h)=>({zr:D/2,y:z=>e+h*z/(D/2)})},
  'croupes':{nom:'Croupes',h0:2.4,hr:[.8,4],mur:e=>e,
    faces:(W,D,e,h)=>{const a=Math.min(W,D)*.45;return[
      [[[W,e,0],[W,e,D],[W-a,e+h,D/2]],'fb'],
      [[[0,e,0],[W,e,0],[W-a,e+h,D/2],[a,e+h,D/2]],'fa']];},
    place:(W,D,e,h)=>{const a=Math.min(W,D)*.45;return{z0:0,z1:D/2,y:z=>e+h*z/(D/2),xr:z=>[a*z/(D/2),W-a*z/(D/2)]};},
    top:(W,D,e,h)=>[W/2,e+h,D/2],prof:(W,D,e,h)=>({zr:D/2,y:z=>e+h*z/(D/2)})},
  'pavillon':{nom:'Pavillon',h0:2.8,hr:[.8,4],mur:e=>e,
    faces:(W,D,e,h)=>[
      [[[W,e,0],[W,e,D],[W/2,e+h,D/2]],'fb'],
      [[[0,e,0],[W,e,0],[W/2,e+h,D/2]],'fa']],
    place:(W,D,e,h)=>({z0:0,z1:D/2*.92,y:z=>e+h*z/(D/2),xr:z=>[W/2*z/(D/2),W-W/2*z/(D/2)]}),
    top:(W,D,e,h)=>[W/2,e+h,D/2],prof:null},
  'demi-croupe':{nom:'Demi-croupe',h0:2.6,hr:[.8,4],mur:e=>e,
    faces:(W,D,e,h)=>{const d=Math.min(1.3,W*.15),hh=e+.62*h,zh=.62*D/2;return[
      [[[W,e,0],[W,e,D],[W-d,hh,D-zh],[W-d,hh,zh]],'fb'],
      [[[W-d,hh,zh],[W-d,hh,D-zh],[W-d,e+h,D/2]],'fc'],
      [[[0,e,0],[W,e,0],[W-d,hh,zh],[W-d,e+h,D/2],[d,e+h,D/2],[d,hh,zh]],'fa']];},
    place:(W,D,e,h)=>{const d=Math.min(1.3,W*.15),zh=.62*D/2;return{z0:0,z1:D/2,y:z=>e+h*z/(D/2),xr:z=>{const m=z<zh?d*z/zh:d;return[m,W-m];}};},
    top:(W,D,e,h)=>[W/2,e+h,D/2],prof:(W,D,e,h)=>({zr:D/2,y:z=>e+h*z/(D/2)})},
  'mansart':{nom:'Mansart',h0:2.8,hr:[1.4,4],mur:e=>e,
    faces:(W,D,e,h)=>{const xb=Math.min(1.1,W*.12),zb=.9,hb=e+.68*h,t=1.3,t2=.9;return[
      [[[W,e,0],[W,e,D],[W-xb,hb,D-zb],[W-xb,hb,zb]],'fb'],
      [[[0,e,0],[W,e,0],[W-xb,hb,zb],[xb,hb,zb]],'fa'],
      [[[xb+t,e+h,zb+t2],[W-xb-t,e+h,zb+t2],[W-xb-t,e+h,D-zb-t2],[xb+t,e+h,D-zb-t2]],'fd'],
      [[[W-xb,hb,zb],[W-xb,hb,D-zb],[W-xb-t,e+h,D-zb-t2],[W-xb-t,e+h,zb+t2]],'fb'],
      [[[xb,hb,zb],[W-xb,hb,zb],[W-xb-t,e+h,zb+t2],[xb+t,e+h,zb+t2]],'fd']];},
    place:(W,D,e,h)=>{const xb=Math.min(1.1,W*.12),zb=.9,hb=e+.68*h;return{z0:0,z1:zb,y:z=>e+(hb-e)*z/zb,xr:z=>[xb*z/zb,W-xb*z/zb]};},
    top:(W,D,e,h)=>[W/2,e+h,D/2],
    prof:(W,D,e,h)=>{const zb=.9,t2=.9,hb=e+.68*h;return{zr:zb+t2,y:z=>z<zb?e+(hb-e)*z/zb:hb+(e+h-hb)*(z-zb)/t2};}},
  'brise':{nom:'Brisé',h0:2.6,hr:[1,4],mur:e=>e,
    faces:(W,D,e,h)=>{const zb=.22*D,hb=e+.62*h;return[
      [[[W,e,0],[W,e,D],[W,hb,D-zb],[W,e+h,D/2],[W,hb,zb]],'fc'],
      [[[0,e,0],[W,e,0],[W,hb,zb],[0,hb,zb]],'fa'],
      [[[0,hb,zb],[W,hb,zb],[W,e+h,D/2],[0,e+h,D/2]],'fd']];},
    place:(W,D,e,h)=>{const zb=.22*D,hb=e+.62*h;return{z0:zb,z1:D/2,y:z=>hb+(e+h-hb)*(z-zb)/(D/2-zb),xr:()=>[0,W]};},
    top:(W,D,e,h)=>[W/2,e+h,D/2],
    prof:(W,D,e,h)=>{const zb=.22*D,hb=e+.62*h;return{zr:D/2,y:z=>z<zb?e+(hb-e)*z/zb:hb+(e+h-hb)*(z-zb)/(D/2-zb)};}},
  'papillon':{nom:'Papillon',h0:1.3,hr:[.5,2.4],mur:(e,h)=>e+h,
    faces:(W,D,e,h)=>[
      [[[0,e,D/2],[W,e,D/2],[W,e+h,D],[0,e+h,D]],'fa'],
      [[[0,e+h,0],[W,e+h,0],[W,e,D/2],[0,e,D/2]],'fb']],
    place:(W,D,e,h)=>({z0:D/2,z1:D,y:z=>e+h*(z-D/2)/(D/2),xr:()=>[0,W]}),top:(W,D,e,h)=>[W/2,e+h,D],prof:null},
  'berceau':{nom:'Berceau',h0:2,hr:[.8,3.4],mur:e=>e,
    faces:(W,D,e,h)=>{const n=12,th=i=>Math.PI*i/n,pz=i=>D/2*(1-Math.cos(th(i))),py=i=>e+h*Math.sin(th(i));
      const arc=[];for(let i=0;i<=n;i++)arc.push([W,py(i),pz(i)]);
      const out=[[arc,'fc']];
      for(let i=n-1;i>=0;i--)out.push([[[0,py(i),pz(i)],[W,py(i),pz(i)],[W,py(i+1),pz(i+1)],[0,py(i+1),pz(i+1)]],i>=n/2?'fb':(i%2?'fa':'fd')]);
      return out;},
    place:(W,D,e,h)=>({z0:0,z1:D/2*.9,y:z=>e+h*Math.sin(Math.acos(clamp(1-2*z/D,-1,1))),xr:()=>[0,W]}),
    top:(W,D,e,h)=>[W/2,e+h,D/2],prof:null}
};
// 3D : les formes dessinees n'ont que leurs faces visibles ; sym dit comment retrouver les autres (miroir en x, en z)
['plat','deux-pans','croupes','pavillon','demi-croupe','mansart','brise'].forEach(k=>{SHAPES[k].sym='xz';});
SHAPES.appentis.sym='x';SHAPES.berceau.sym='x';
SHAPES.appentis.extra=(W,D,e,h)=>[[[[0,e,D],[W,e,D],[W,e+h,D],[0,e+h,D]],'fc']];
const ORDRE_FORMES=['plat','appentis','deux-pans','croupes','pavillon','demi-croupe','mansart','brise','papillon','berceau'];

/* ---------- les éléments posés sur le pan ---------- */
const ELEMS={cheminee:{nom:'Cheminée',w:.75},jacobine:{nom:'Jacobine',w:1.5},'chien-assis':{nom:'Chien-assis',w:1.5},velux:{nom:'Fenêtre',w:1},solaire:{nom:'Solaire',w:2.55}};
const ORDRE_ELEMS=['cheminee','jacobine','chien-assis','velux','solaire'];
function drawEl(kind,cx,z,s,yAt){
  const t=(yAt(z+.05)-yAt(z-.05))/.1;let o='';
  if(kind==='cheminee'){
    const w=.75*s,x=cx-w/2,zf=z-w/2,zb=z+w/2,yf=yAt(zf),yb=yAt(zb),yt=Math.max(yf,yb)+1.15*s;
    o+=poly([[x+w,yf,zf],[x+w,yt,zf],[x+w,yt,zb],[x+w,yb,zb]],'es');
    o+=poly([[x-.05,yt,zf-.05],[x+w+.05,yt,zf-.05],[x+w+.05,yt,zb+.05],[x-.05,yt,zb+.05]],'et');
    o+=poly([[x,yf,zf],[x+w,yf,zf],[x+w,yt,zf],[x,yt,zf]],'ef');
    o+=poly([[x+w*.22,yt+.01,z-w*.2],[x+w*.78,yt+.01,z-w*.2],[x+w*.78,yt+.01,z+w*.2],[x+w*.22,yt+.01,z+w*.2]],'dr');
  }else if(kind==='jacobine'||kind==='chien-assis'){
    const w=1.5*s,x=cx-w/2,xm=cx,y0=yAt(z),fh=(kind==='jacobine'?1.15:.95)*s,gh=.55*s;
    const dd=clamp(t>.01?(fh*.8)/t:1.5*s,.5*s,1.5*s),yb=yAt(z+dd);
    if(kind==='jacobine'){
      const yt=y0+fh;
      o+=poly([[x+w,y0,z],[x+w,yt,z],[x+w,yt,z+dd],[x+w,yb,z+dd]],'es');
      o+=poly([[x+w,yt,z],[xm,yt+gh,z],[xm,yt+gh,z+dd],[x+w,yt,z+dd]],'er');
      o+=poly([[x,y0,z],[x+w,y0,z],[x+w,yt,z],[x,yt,z]],'ef');
      o+=poly([[x,yt,z],[x+w,yt,z],[xm,yt+gh,z]],'ef');
      o+=poly([[x+w*.25,y0+fh*.18,z],[x+w*.75,y0+fh*.18,z],[x+w*.75,y0+fh*.86,z],[x+w*.25,y0+fh*.86,z]],'eg');
    }else{
      const yt=y0+fh,ytb=y0+fh*.78;
      o+=poly([[x+w,y0,z],[x+w,yt,z],[x+w,ytb,z+dd],[x+w,yb,z+dd]],'es');
      o+=poly([[x-.08,yt,z-.06],[x+w+.08,yt,z-.06],[x+w+.08,ytb,z+dd],[x-.08,ytb,z+dd]],'er');
      o+=poly([[x,y0,z],[x+w,y0,z],[x+w,yt,z],[x,yt,z]],'ef');
      o+=poly([[x+w*.14,y0+fh*.2,z],[x+w*.86,y0+fh*.2,z],[x+w*.86,y0+fh*.78,z],[x+w*.14,y0+fh*.78,z]],'eg');
    }
  }else if(kind==='velux'){
    const k=Math.hypot(1,t),hw=.5*s,hz=.7*s/k,q=(a,b)=>[[cx-a,yAt(z-b),z-b],[cx+a,yAt(z-b),z-b],[cx+a,yAt(z+b),z+b],[cx-a,yAt(z+b),z+b]];
    o+=poly(q(hw,hz),'ef')+poly(q(hw*.72,hz*.72),'eg');

}

/* ---------- pièces de façade : pignon traversant et appentis adossé ----------
   pignon   : x, w (m), ha (null = au faîtage), g (saillie devant le mur, 0 = dans le plan de la façade)
   appentis : x0, x1 (null = jusqu'au bout), p (profondeur), eg (égout), ouvert ; le haut contre le mur suit : eg + 0,6 p */
const profilDe=z=>{const f=SHAPES[z.shape].prof;return f?f(z.w,z.d,z.e,z.h):null;};
function zinv(pr,y){let a=0,b=pr.zr;for(let i=0;i<30;i++){const m=(a+b)/2;if(pr.y(m)<y)a=m;else b=m;}return(a+b)/2;}
const apexDe=(z,pg)=>{const rt=z.e+z.h;return pg.ha==null?rt:clamp(pg.ha,z.e+.8,rt);};
const finApp=(z,ap)=>ap.x1==null?z.w:Math.min(ap.x1,z.w);
const hautApp=ap=>ap.eg+.6*ap.p;
function fenetre(cx,y,zz,ww,hh,dx){return poly(sh([[cx-ww/2,y,zz],[cx+ww/2,y,zz],[cx+ww/2,y+hh,zz],[cx-ww/2,y+hh,zz]],dx),'gl');}
const retraitDe=ap=>Math.max(0,ap.retrait||0);
const cutsOf=z=>z.app.filter(a=>retraitDe(a)>.02).map(a=>({x0:a.x0,x1:finApp(z,a),r:retraitDe(a),hw:Math.min(hautApp(a),SHAPES[z.shape].mur(z.e,z.h))})).sort((a,b)=>a.x0-b.x0);
// le mur de face : d'un seul tenant, ou decoupe là où une galerie coloniale le recule
function frontWall(z){
  const W=z.w,wt=SHAPES[z.shape].mur(z.e,z.h),cuts=cutsOf(z);
  if(!cuts.length)return[[[[0,0,0],[W,0,0],[W,wt,0],[0,wt,0]],'wl']];
  const out=[];let x=0;
  cuts.forEach(c=>{
    out.push([[[c.x0,0,c.r],[c.x1,0,c.r],[c.x1,c.hw,c.r],[c.x0,c.hw,c.r]],'wl']);
    out.push([[[c.x0,0,0],[c.x0,0,c.r],[c.x0,c.hw,c.r],[c.x0,c.hw,0]],'ws']);
    out.push([[[c.x1,0,0],[c.x1,0,c.r],[c.x1,c.hw,c.r],[c.x1,c.hw,0]],'ws']);
  });
  cuts.forEach(c=>{
    if(c.x0>x)out.push([[[x,0,0],[c.x0,0,0],[c.x0,wt,0],[x,wt,0]],'wl']);
    if(wt>c.hw)out.push([[[c.x0,c.hw,0],[c.x1,c.hw,0],[c.x1,wt,0],[c.x0,wt,0]],'wl']);
    x=c.x1;
  });
  if(x<W)out.push([[[x,0,0],[W,0,0],[W,wt,0],[x,wt,0]],'wl']);
  return out;
}
// bow-window : trois facettes en saillie sur le mur, petit toit en lean-to. Il est porte par la facade : il ne la coupe pas.
function bowGeo(z,bw){
  const hb=Math.min(bw.hb,z.e-.5),s=Math.max(.15,Math.min(bw.p,(bw.w-.8)/2));
  return{s,x0:bw.x,x1:bw.x+bw.w,xa:bw.x+s,xb:bw.x+bw.w-s,hb,p:bw.p,yr:hb+Math.min(.8,.35+.12*bw.w)};
}
function drawBow(z,bw,dx){
  const g=bowGeo(z,bw),{x0,x1,xa,xb,hb,p,yr}=g,L=lerp;let o='';
  const vit=(ax,az,bx,bz)=>poly(sh([[L(ax,bx,.2),hb*.28,L(az,bz,.2)],[L(ax,bx,.8),hb*.28,L(az,bz,.8)],[L(ax,bx,.8),hb*.86,L(az,bz,.8)],[L(ax,bx,.2),hb*.86,L(az,bz,.2)]],dx),'gl');
  o+=poly(sh([[x0,0,0],[xa,0,-p],[xa,hb,-p],[x0,hb,0]],dx),'wl')+vit(x0,0,xa,-p);
  o+=poly(sh([[xb,0,-p],[x1,0,0],[x1,hb,0],[xb,hb,-p]],dx),'ws')+vit(xb,-p,x1,0);
  o+=poly(sh([[xa,0,-p],[xb,0,-p],[xb,hb,-p],[xa,hb,-p]],dx),'wl')+vit(xa,-p,xb,-p);
  o+=poly(sh([[x0,hb,0],[xa,hb,-p],[xa,yr,0]],dx),'fb');
  o+=poly(sh([[xb,hb,-p],[x1,hb,0],[xb,yr,0]],dx),'fb');
  o+=poly(sh([[xa,hb,-p],[xb,hb,-p],[xb,yr,0],[xa,yr,0]],dx),'fa');
  return o;
}
function drawPig(z,pg,dx){
  const pr=profilDe(z);if(!pr)return '';
  const e=z.e,ra=apexDe(z,pg),x0=pg.x,x1=pg.x+pg.w,xm=pg.x+pg.w/2,g=pg.g;
  const V=[];for(let i=0;i<=6;i++){const t=i/6,y=lerp(ra,e,t);V.push([lerp(xm,x1,t),y,zinv(pr,y)]);}
  let o='';
  if(g>.02)o+=poly(sh([[x1,0,-g],[x1,0,0],[x1,e,0],[x1,e,-g]],dx),'ws');
  o+=poly(sh([[x1,e,-g],[xm,ra,-g]].concat(V),dx),'fb');
  if(g>.02){
    o+=poly(sh([[x0,0,-g],[x1,0,-g],[x1,e,-g],[x0,e,-g]],dx),'wl');
    o+=fenetre(xm,e*.3,-g,Math.min(.95,pg.w*.3),Math.min(1.25,e*.3),dx);
  }
  o+=poly(sh([[x0,e,-g],[x1,e,-g],[xm,ra,-g]],dx),'wl');
  if(ra-e>1.2)o+=fenetre(xm,e+(ra-e)*.25,-g,.5,.55,dx);
  return o;
}
function drawApp(z,ap,dx){
  const x0=ap.x0,x1=finApp(z,ap),p=ap.p,eg=ap.eg,hw=hautApp(ap);let o='';
  if(ap.ouvert){
    const r0=retraitDe(ap);o+=poly(sh([[x0,0,r0],[x1,0,r0],[x1,hw,r0],[x0,hw,r0]],dx),'sh');
    const n=Math.max(1,Math.round((x1-x0)/2.2));
    for(let i=0;i<=n;i++){const x=lerp(x0,x1,i/n),a=i===0?x:i===n?x-.14:x-.07;o+=poly(sh([[a,0,-p],[a+.14,0,-p],[a+.14,eg,-p],[a,eg,-p]],dx),'po');}
  }else{
    o+=poly(sh([[x1,0,-p],[x1,0,0],[x1,hw,0],[x1,eg,-p]],dx),'ws');
    o+=poly(sh([[x0,0,-p],[x1,0,-p],[x1,eg,-p],[x0,eg,-p]],dx),'wl');
    const n=Math.max(1,Math.floor((x1-x0)/2));for(let i=0;i<n;i++)o+=fenetre(lerp(x0,x1,(i+.5)/n),eg*.3,-p,.9,eg*.4,dx);
  }
  o+=poly(sh([[x0,hw,0],[x1,hw,0],[x1,eg,-p],[x0,eg,-p]],dx),'fa');
  o+=poly(sh([[x0,eg,-p],[x1,eg,-p],[x1,eg-.16,-p],[x0,eg-.16,-p]],dx),'po');
  return o;
}

const svg=document.getElementById('svg'), scene=document.getElementById('scene');
function windowsSVG(z,dx){
  let o='';const wt=SHAPES[z.shape].mur(z.e,z.h),L=Math.max(1,Math.floor(wt/2.6)),lh=wt/L,n=Math.max(1,Math.floor(z.w/2.4));
  const cuts=cutsOf(z),zAt=(cx,y)=>{const c=cuts.find(q=>cx>q.x0&&cx<q.x1&&y<q.hw);return c?c.r:0;};
  if(z.k==='d'){const gw=Math.min(2.6,z.w*.6);return poly(sh([[z.w/2-gw/2,0,0],[z.w/2+gw/2,0,0],[z.w/2+gw/2,2.1,0],[z.w/2-gw/2,2.1,0]],dx),'dr');}
  for(let l=0;l<L;l++)for(let j=0;j<n;j++){
    const cx=(j+.5)*z.w/n;
    if(z.k==='m'&&l===0&&j===Math.floor(n/2)){const zr=zAt(cx,0);o+=poly(sh([[cx-.55,0,zr],[cx+.55,0,zr],[cx+.55,2.1,zr],[cx-.55,2.1,zr]],dx),'dr');continue;}
    o+=fenetre(cx,l*lh+lh*.34,zAt(cx,l*lh+lh*.34),Math.min(.95,z.w/n*.5),Math.min(1.25,lh*.5),dx);
  }

}
function bodySVG(z,dx,win){
  const S=SHAPES[z.shape],W=z.w,D=z.d,e=z.e,h=z.h,wt=S.mur(e,h);
  const rw=z.shape==='papillon'?[[W,0,0],[W,0,D],[W,wt,D],[W,e,D/2],[W,wt,0]]:[[W,0,0],[W,0,D],[W,wt,D],[W,wt,0]];
  let o=poly(sh(rw,dx),'ws')+frontWall(z).map(f=>poly(sh(f[0],dx),f[1])).join('');

}
function elPos(z,el){

function bornes(pts){let a=[1e9,1e9,-1e9,-1e9];pts.forEach(p=>{a=[Math.min(a[0],p[0]),Math.min(a[1],p[1]),Math.max(a[2],p[0]),Math.max(a[3],p[1])];});return a;}

function carte(box,kind,key,nom,vb,corps){

    ACC=[];const body=bodySVG(z,0,true);return{k,body,pts:ACC};});
  const vf=vbDe(bornes([].concat(...fs.map(b=>b.pts))),.3),cf=document.getElementById('cards-forme');
  fs.forEach(b=>{TH.forme[b.k]={body:b.body,vb:vf};carte(cf,'shape',b.k,SHAPES[b.k].nom,vf,b.body);});
  // pièces posées sur une maison à deux pans
  const base=()=>Object.assign({_x:0,w:7,d:5.4,e:2.4,h:2.1,shape:'deux-pans'},vide());
  const mk=(f)=>{const z=base();f(z);ACC=[];const body=bodySVG(z,0,true)+z.pig.map(q=>drawPig(z,q,0)).join('')+z.app.map(q=>drawApp(z,q,0)).join('')+z.bow.map(q=>drawBow(z,q,0)).join('');return{body,pts:ACC};};
  const pieces={
    pig:mk(z=>{z.pig=[{x:.3,w:2.7,ha:null,g:0}];}),
    app:mk(z=>{z.app=[{x0:0,x1:null,p:1.3,eg:1.6,ouvert:true,retrait:0}];}),

  const vp=vbDe(bornes([].concat(pieces.pig.pts,pieces.app.pts,pieces.gal.pts,pieces.bow.pts)),.3);
  ['pig','app','gal','bow'].forEach(k=>{TH[k]={body:pieces[k].body,vb:vp};});
  // éléments : posés sur une pente d'essai

    TH.el[k]={body,vb:vbDe(bornes(ACC),.2)};
  });

const NOMS={bow:'Bow-window',pig:'Pignon',app:'Appentis',gal:'Galerie coloniale',aile:'Aile',retour:'Retour'};
function nomStep(s){

/* le catalogue : les éléments de départ. Chacun est une recette (volume, toit, découpe de façade) */
const CAT=[
  ['Volume',[['aile'],['retour']]],
  ['Toit',[['pig'],['app'],['jacobine'],['chien-assis'],['velux'],['solaire'],['cheminee']]],
  ['Façade',[['gal'],['bow']]]];
// ou poser un nouveau corps : a droite de la maison, ou derriere le corps principal (cherche une place libre)
function nouveauCorps(o){return Object.assign({id:'z'+(++nid),nom:'Corps',k:'g',z0:0,d:5,e:2.6,h:1.6,dir:'x',els:[],pig:[],app:[],bow:[]},o);}
function emplacementAile(){
  const xs=Math.max(...model.zones.filter(q=>q.dir!=='z'||true).map(q=>q.x+q.w)),c={x:xs,z0:0,w:3,d:5};
  return xs+3<=LARGEUR_MAX?c:null;
}
function emplacementRetour(){
  const m=zoneOf('m');if(!m)return null;
  const essais=[m.x+m.w-3,m.x,m.x+(m.w-3)/2];
  for(const x of essais){
    const t={x,z0:m.z0+m.d-1.5,w:3,d:5};  // il entre de 1,5 m dans le corps principal : les deux toits se croisent
    if(t.x+t.w<=LARGEUR_MAX&&t.z0+t.d<=PROF_MAX&&model.zones.every(q=>q.x!==t.x||q.z0!==t.z0))return t;
  }

}
function ouvrirCat(){
  const z=zoneOf(sel.zone),zp=profilDe(z)?z:zoneOf('m');
  let h='';
  CAT.forEach(([sec,its])=>{
    h+='<div><h2>'+sec+'</h2><div class="grid">';
    its.forEach(([k])=>{
      const t=k==='aile'?TH.aile:TH.el[k]||TH[k],nom=NOMS[k]||ELEMS[k].nom;
      const off=(k==='bow'&&zp.w<1.8)||(k==='pig'&&!profilDe(zp))||(k==='aile'&&!emplacementAile())||(k==='retour'&&!emplacementRetour());
      h+='<button class="card" data-add="'+k+'" aria-label="'+nom+'" title="'+nom+'"'+(off?' disabled':'')+'><svg viewBox="'+t.vb+'">'+t.body+'</svg><span>'+nom+'</span></button>';
    });

document.getElementById('cat-x').addEventListener('click',fermerCat);
document.getElementById('cat').addEventListener('click',ev=>{
  if(ev.target.id==='cat'){fermerCat();return;}
  const b=ev.target.closest('[data-add]');if(!b||b.disabled)return;
  const k=b.dataset.add,z=zoneOf(sel.zone),zp=profilDe(z)?z:zoneOf('m');
  if(k==='pig'){const pg=addPig(zp,libreX(zp,Math.min(3.2,zp.w)));addStep('pig',pg.id);}
  else if(k==='bow'){const zb=z.dir==='z'?zoneOf('m'):z,bw=addBow(zb);addStep('bow',bw.id);}
  else if(k==='app'||k==='gal'){const ap=addApp(z);ap.retrait=k==='gal'?.5:0;addStep('app',ap.id);}
  else if(k==='aile'||k==='retour'){
    const pos=k==='aile'?emplacementAile():emplacementRetour();if(!pos)return;
    const nz=nouveauCorps(Object.assign({nom:k==='aile'?'Aile':'Retour',shape:k==='aile'?'appentis':'deux-pans',h:k==='aile'?1.2:2.2,e:k==='aile'?2.6:3.4,dir:k==='aile'?'x':'z'},pos));
    model.zones.push(nz);addStep('aile',nz.id);sel={zone:nz.id,id:null};faceMode='plan';
  }

/* la coupe : le profil complet du corps, perpendiculaire à son faîtage */
const svg2=document.getElementById('svg2');
function hProfil(z,zz){
  const e=z.e,h=z.h,D=z.d;
  switch(z.shape){
    case'plat':return e+.35;case'appentis':return e+h*zz/D;case'papillon':return e+h*Math.abs(zz-D/2)/(D/2);
    case'berceau':return e+h*Math.sqrt(Math.max(0,1-Math.pow(1-2*zz/D,2)));
    case'pavillon':return e+h*Math.min(zz,D-zz)/(D/2);
    default:{const pr=profilDe(z),q=Math.min(zz,D-zz);return q>=pr.zr?e+h:pr.y(q);}
  }
}
function renderCoupe(){
  const z=zoneLocal(zoneOf(sel.zone)),S=SHAPES[z.shape],n=64,pts=[];let hm=0,zs=0;
  for(let i=0;i<=n;i++){const zz=z.d*i/n,y=hProfil(z,zz);pts.push([zz,y]);if(y>hm+1e-6){hm=y;zs=zz;}}
  const top=Math.max(hm,z.e)+1.3;
  svg2.setAttribute('viewBox',(-2)+' '+(-top)+' '+(z.d+4)+' '+(top+1.4));
  const L=pts.map(q=>f2(q[0])+','+f2(-q[1])).join(' ');
  let o='<polygon class="sol" points="-30,0 40,0 40,4 -30,4"/>'+
    '<polygon class="wl" points="0,0 '+L+' '+f2(z.d)+',0"/>'+
    '<polyline class="cr" points="'+L+'"/>';
  const U=unit(svg2);let ov='';
  if(!drag){
    if(S.hr)ov+=hdl('hauteur',[zs,-hm],PV,U);
    ov+=hdl('ce',[0,-hProfil(z,0)],PV,U)+hdl('cd',[z.d,-hProfil(z,z.d)/2],PH,U);
  }
  svg2.innerHTML=o+'<g>'+ov+'</g>';
  const pl=place(z),mid=(pl.z0+pl.z1)/2,ang=Math.atan2(pl.y(mid+.05)-pl.y(mid-.05),.1);
  chip.innerHTML=puce('prof',fr(z.d)+' m')+puce('ang',deg(ang)+'°')+puce('h',fr(hm)+' m');chip.hidden=false;ctx.hidden=true;
  const c=toPx(zs,-hm,svg2);poseBulle(chip,c[0],c[1]-(S.hr?42:16),true);
}
svg2.addEventListener('pointerdown',ev=>{

/* le plan : la ou l'on pose les corps. Chaque corps est un rectangle avec son faitage ; il se deplace, s'etire, se tourne */
const svg3=document.getElementById('svg3');
const RB='M-4.5 -2A5 5 0 014.5 -2M4.5 -6V-2H1M4.5 2A5 5 0 01-4.5 2M-4.5 6V2H-1';
const PLn=(x,zz)=>[x,-zz];
function lignesToit(z){
  const L=z.dir==='z'?z.d:z.w,S=z.dir==='z'?z.w:z.d,mid=S/2,a0=Math.min(L,S)*.45,sg=[];
  switch(z.shape){
    case'plat':break;
    case'appentis':sg.push([[0,S],[L,S]]);break;
    case'croupes':sg.push([[a0,mid],[L-a0,mid]],[[0,0],[a0,mid]],[[0,S],[a0,mid]],[[L,0],[L-a0,mid]],[[L,S],[L-a0,mid]]);break;
    case'pavillon':{const c=[L/2,mid];sg.push([[0,0],c],[[L,0],c],[[0,S],c],[[L,S],c]);break;}
    default:sg.push([[0,mid],[L,mid]]);
  }
  // du repere propre (a le long du faitage, b en travers) au plan : meme symetrie que worldPt
  return sg.map(l=>l.map(q=>z.dir==='z'?[z.x+z.w-q[1],z.z0+z.d-q[0]]:[z.x+q[0],z.z0+q[1]]));

    z.bow.forEach(bw=>{const g=bowGeo(z,bw),pts=[[g.x0,0],[g.xa,-g.p],[g.xb,-g.p],[g.x1,0]].map(q=>PLn(z.x+q[0],q[1]));

  });
  let ov='';
  if(!drag&&!sel.id&&zr){
    const aucune=!(zr.pig.length||zr.app.length||zr.els.length||zr.bow.length);

/* ---------- gestes ---------- */
function locate(p){
  let best=null;
  model.zones.forEach(z=>{
    if(z.dir==='z')return;
    const z0=z.z0||0,pl=place(z),Y=-p.y,f=zz=>pl.y(zz)+M*(zz+z0)-Y;let a=pl.z0,b=pl.z1,zz;
    if(f(a)>=0)zz=a;else if(f(b)<=0)zz=b;else{for(let i=0;i<30;i++){const m=(a+b)/2;if(f(m)<0)a=m;else b=m;}zz=(a+b)/2;}
    let x=p.x-K*(zz+z0)-z._x;const r=pl.xr(zz);x=r[1]-r[0]<.5?(r[0]+r[1])/2:clamp(x,r[0]+.25,r[1]-.25);
    const q=P(z._x+x,pl.y(zz),zz+z0),d=Math.hypot(q[0]-p.x,q[1]-p.y);
    if(!best||d<best.d)best={z,u:x/z.w,v:(zz-pl.z0)/((pl.z1-pl.z0)||1),d};
  });
  return best;
}
// la zone de façade sous le doigt : la plus proche, parmi celles qui acceptent une pièce
function zoneSousLeDoigt(ev,p){
  const zid=zoneAtClient(ev);
  let z=zid?zoneOf(zid):null;
  if(!z||!profilDe(z))z=zoneOf(sel.zone);
  if(!profilDe(z))z=zoneOf('m');
  return z;
}
function libreX(z,w,sauf){
  const autres=z.pig.filter(q=>q.id!==sauf);
  for(const c of [0,z.w-w,(z.w-w)/2,0]){if(c<0||c+w>z.w+.01)continue;if(autres.every(q=>c+w<=q.x+.01||c>=q.x+q.w-.01))return c;}
  return clamp((z.w-w)/2,0,z.w-w);
}
function addPig(z,x){const pg={id:'p'+(++nid),x:clamp(x,0,z.w-3.2),w:Math.min(3.2,z.w),ha:null,g:0};z.pig.push(pg);sel={zone:z.id,id:pg.id};return pg;}
function addBow(z){
  const w=Math.min(2.6,z.w-.5),hb=Math.min(2.2,z.e-.6);
  let x=(z.w-w)/2;
  for(const c of [(z.w-w)/2,.2,z.w-w-.2]){if(z.bow.every(q=>c+w<=q.x+.05||c>=q.x+q.w-.05)){x=c;break;}}
  const bw={id:'b'+(++nid),x:Math.round(x*20)/20,w,p:.65,hb};z.bow.push(bw);sel={zone:z.id,id:bw.id};return bw;
}
function addApp(z){const ap={id:'a'+(++nid),x0:0,x1:null,p:1.25,eg:Math.min(2.4,z.e-1),ouvert:true};z.app.push(ap);sel={zone:z.id,id:ap.id};return ap;}
function addEl(kind,zone,u,v){const e={id:'e'+(++nid),kind,u,v,s:1};zone.els.push(e);sel={zone:zone.id,id:e.id};return e;}
function stopHint(){if(hintOn){hintOn=false;hint.hidden=true;}}

// ajustement magnétique d'un pignon : bords de la façade, symétrie, faîtage
function aimanterX(z,pg,x){
  const cand=[0,z.w-pg.w];z.pig.forEach(q=>{if(q!==pg)cand.push(z.w-(q.x+q.w),q.x+q.w,q.x-pg.w);});
  for(const c of cand)if(Math.abs(x-c)<.25)return clamp(c,0,z.w-pg.w);
  return clamp(Math.round(x*20)/20,0,z.w-pg.w);
}

function bougerDrag(ev){
  const p=svgPt(ev,drag.s||svg);drag.moved=true;
  const d=drag,dx=p.x-(d.p0?d.p0.x:0),dy=p.y-(d.p0?d.p0.y:0),z=d.z||(d.f&&d.f.z),o=d.f&&d.f.o,v=d.v0;
  guides=[];
  switch(d.type){
  case 'el':{
    const loc=locate({x:p.x-d.off.x,y:p.y-d.off.y}),cur=findItem(o.id);
    if(cur.z!==loc.z){cur.z.els.splice(cur.z.els.indexOf(cur.o),1);loc.z.els.push(o);}
    o.u=loc.u;o.v=loc.v;sel.zone=loc.z.id;break;}
  case 'hauteur':{const hr=SHAPES[z.shape].hr;z.h=clamp(d.h0-dy,hr[0],hr[1]);break;}
  case 'largeur':{const ow=z.w;z.w=Math.round(clamp(d.w0+dx,minW(z),LARGEUR_MAX-z.x)*20)/20;if(!libre(z))z.w=ow;break;}
  case 'xm':{
    const bords=ax=>model.zones.filter(q=>q!==z).flatMap(q=>ax==='x'?[q.x,q.x+q.w]:[q.z0,q.z0+q.d]);
    const aimante=(v,taille,list)=>{for(const e of list){if(Math.abs(v-e)<.3)return e;if(Math.abs(v+taille-e)<.3)return e-taille;}return Math.round(v*10)/10;};
    const nx=clamp(aimante(d.x0+dx,z.w,bords('x')),0,LARGEUR_MAX-z.w),nz=clamp(aimante(d.z00-dy,z.d,bords('z')),0,PROF_MAX-z.d);
    z.x=nx;z.z0=nz;if(!libre(z)){z.x=d.lx;z.z0=d.lz;}else{d.lx=nx;d.lz=nz;}break;}
  case 'xw':{const ow=z.w;let w=clamp(d.w0+dx,minW(z),LARGEUR_MAX-z.x);
    for(const q of model.zones)if(q!==z){for(const e of [q.x,q.x+q.w])if(Math.abs(z.x+w-e)<.3)w=e-z.x;}
    z.w=Math.round(w*10)/10;if(!libre(z))z.w=ow;break;}
  case 'xd':{const od=z.d;let dd=clamp(d.d0-dy,3,PROF_MAX-z.z0);
    for(const q of model.zones)if(q!==z){for(const e of [q.z0,q.z0+q.d])if(Math.abs(z.z0+dd-e)<.3)dd=e-z.z0;}
    z.d=Math.round(dd*10)/10;if(!libre(z))z.d=od;break;}
  case 'taille':o.s=clamp(v.s+dx/2.2,.5,2.2);break;
  case 'mpig':{o.x=aimanterX(z,o,v.x+dx);break;}
  case 'pw':{let w=clamp(v.w+dx,1.4,Math.min(8,z.w-o.x));if(Math.abs(o.x+w-z.w)<.25)w=z.w-o.x;o.w=Math.round(w*20)/20;break;}
  case 'pa':{const rt=z.e+z.h,ra=clamp((v.ha==null?rt:v.ha)-dy,z.e+.8,rt);
    if(rt-ra<.25){o.ha=null;guides=[[z._x,rt,-o.g,z._x+z.w,rt,-o.g]];}
    else o.ha=Math.round(ra*20)/20;break;}
  case 'ps':{o.g=clamp(v.g-dzDe(dx,dy),0,2.5);o.g=Math.round(o.g*20)/20;break;}
  case 'mapp':{const L=finApp(z,v)-v.x0,x0=clamp(v.x0+dx,0,z.w-L);o.x0=Math.round(x0*20)/20;o.x1=(v.x1==null&&x0+L>=z.w-.01)?null:o.x0+L;
    if(v.x1==null&&o.x0===0)o.x1=null;break;}
  case 'al':{const x1=finApp(z,v);let x=clamp(v.x0+dx,0,x1-1.2);if(x<.25)x=0;o.x0=Math.round(x*20)/20;break;}
  case 'ar':{let x=clamp(finApp(z,v)+dx,v.x0+1.2,z.w);o.x1=x>z.w-.25?null:Math.round(x*20)/20;break;}
  case 'mbow':{
    const cur=findItem(o.id);if(!cur)break;
    const hotes=model.zones.filter(q=>q.dir!=='z'),cx=d.xw0+v.w/2+dx;
    let h=hotes.find(q=>cx>=q.x&&cx<=q.x+q.w);

  case 'bh':o.hb=Math.round(clamp(v.hb-dy,1.6,Math.max(1.7,z.e-.6))*20)/20;break;
  case 'bp':o.p=Math.round(clamp(v.p-dzDe(dx,dy),.2,1.5)*20)/20;break;
  case 'rt':o.retrait=Math.round(clamp((v.retrait||0)+dzDe(dx,dy),0,1.5)*20)/20;break;
  case 'ce':{const e=clamp(d.e0-dy,2,7.5);z.e=Math.round(e*20)/20;const hr=SHAPES[z.shape].hr;if(hr)z.h=clamp(d.h0+(d.e0-z.e),hr[0],hr[1]);break;}
  case 'cd':{const v2=Math.round(clamp(d.d0+dx,3,9)*20)/20;if(z.dir==='z')z.w=v2;else z.d=v2;if(!libre(z)){if(z.dir==='z')z.w=d.d0;else z.d=d.d0;}break;}
  case 'ae':o.eg=Math.round(clamp(v.eg-dy,1.6,z.e-.9)*20)/20;break;
  case 'ad':o.p=Math.round(clamp(v.p-dzDe(dx,dy),.6,3)*20)/20;break;
  }
  render();
}

function finDrag(annuler){
  if(cardDrag){
    const c=cardDrag;cardDrag=null;
    if(c.ghost){
      c.ghost.remove();model.zones.forEach(z=>{z._cible=false;});
      if(!annuler){
        const zid=zoneAtClient({clientX:c.lx,clientY:c.ly});
        if(zid){sel={zone:zid,id:null};applyShape(c.key);return;}
      }
      render();return;
    }
    if(!annuler&&!c.moved){
      const z=zoneOf(sel.zone);
      if(c.kind==='shape')applyShape(c.key);
      else if(c.kind==='piece'){
        if(!profilDe(z)){render();return;}
        if(c.key==='pig')addPig(z,libreX(z,Math.min(3.2,z.w)));else addApp(z);
        commit();
      }else{addEl(c.key,z,clamp(.25+(z.els.length*.19)%.6,.15,.85),.5);commit();}
    }
    return;
  }
  if(!drag)return;
  const d=drag;drag=null;guides=[];
  if(annuler){restore(hist[hi]);render();return;}
  if(d.moved)commit();else render();
}

  if(mod&&ev.key.toLowerCase()==='z'){ev.preventDefault();ev.shiftKey?redo():undo();}
  else if(mod&&ev.key.toLowerCase()==='y'){ev.preventDefault();redo();}
  else if(ev.key==='Escape'){if(drag||cardDrag)finDrag(true);else{sel.id=null;render();}}
  else if((ev.key==='Delete'||ev.key==='Backspace')&&sel.id){const f=findItem(sel.id);if(f){retirer(f);sel.id=null;commit();}}
});
new ResizeObserver(()=>render()).observe(scene);


/* ---------- 3D : les memes faces que la façade, vues de n'importe ou ---------- */
const T=window.THREE, ok3d=!!(T&&T.OrbitControls);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const MATKEY={wl:'wall',ws:'wall',fc:'wall',fa:'roof',fb:'roof',fd:'roof',er:'roofdk',gl:'glass',eg:'glass',dr:'door',po:'post',ef:'el',es:'el',et:'el',ep:'solar'};
const palette=()=>({wall:css('--wall'),roof:css('--roof'),roofdk:css('--roof-dk'),glass:css('--glass'),door:css('--door'),post:css('--post'),el:css('--el-front'),solar:css('--solar')});
const mirX=(f,cx)=>({p:f.p.map(q=>[2*cx-q[0],q[1],q[2]]),c:f.c});
const mirZ=(f,cz)=>({p:f.p.map(q=>[q[0],q[1],2*cz-q[2]]),c:f.c});
function collect(fn){SINK=[];try{fn();}finally{var o=SINK;SINK=null;}return o;}
function modelFaces(m){
  layoutM(m);let F=[];const parts=[],box={x0:1e9,x1:-1e9,z0:1e9,z1:-1e9};
  m.zones.forEach(zr=>{
    const z=zoneLocal(zr);setCtx(zr);
    box.x0=Math.min(box.x0,zr.x);box.x1=Math.max(box.x1,zr.x+zr.w);box.z0=Math.min(box.z0,zr.z0);box.z1=Math.max(box.z1,zr.z0+zr.d);
    const dx=z._x,W=z.w,D=z.d,e=z.e,h=z.h,S=SHAPES[z.shape],wt=S.mur(e,h),shf=pts=>pts.map(q=>[q[0]+dx,q[1],q[2]]);
    const Fz=F;F=[];  // faces du repere propre du corps, posees dans le monde plus bas
    const side=x=>z.shape==='papillon'?[[x,0,0],[x,0,D],[x,wt,D],[x,e,D/2],[x,wt,0]]:[[x,0,0],[x,0,D],[x,wt,D],[x,wt,0]];
    frontWall(z).forEach(q=>F.push({p:shf(q[0]),c:q[1]}));
    F.push({p:[[dx,0,D],[dx+W,0,D],[dx+W,wt,D],[dx,wt,D]],c:'wl'},{p:side(dx),c:'ws'},{p:side(dx+W),c:'ws'});
    S.faces(W,D,e,h).forEach(f=>{
      let l=[{p:f[0],c:f[1]}];const sym=S.sym||'';
      if(sym.includes('x'))l=l.concat(l.map(q=>mirX(q,W/2)));
      if(sym.includes('z'))l=l.concat(l.map(q=>mirZ(q,D/2)));
      l.forEach(q=>F.push({p:shf(q.p),c:q.c}));
    });
    if(S.extra)S.extra(W,D,e,h).forEach(q=>F.push({p:shf(q[0]),c:q[1]}));
    setCtx(null);collect(()=>windowsSVG(z,dx)).forEach(q=>F.push({p:q.p.map(r=>[r[0],r[1],r[2]-.015]),c:q.c}));setCtx(zr);
    F=F.map(q=>({p:q.p.map(worldPt),c:q.c}));
    const bodyF=F,items=[];F=[];
    z.pig.forEach(pg=>{const c=dx+pg.x+pg.w/2,l=collect(()=>drawPig(z,pg,dx)),r=[];l.forEach(q=>{r.push(q);r.push(mirX(q,c));});items.push({id:pg.id,zone:zr.id,kind:'pig',F:r});});
    z.bow.forEach(bw=>{items.push({id:bw.id,zone:zr.id,kind:'bow',F:collect(()=>drawBow(z,bw,dx))});});
    z.app.forEach(ap=>{const c=dx+(ap.x0+finApp(z,ap))/2,l=collect(()=>drawApp(z,ap,dx)),r=[];l.forEach(q=>{r.push(q);r.push(mirX(q,c));});items.push({id:ap.id,zone:zr.id,kind:'app',F:r});});
    z.els.forEach(el=>{
      const p=elPos(z,el),l=collect(()=>drawEl(el.kind,p.x,p.z,el.s,p.yAt)),r=[];
      l.forEach(q=>{r.push(q);r.push(mirX(q,p.x));if(el.kind==='cheminee'){r.push(mirZ(q,p.z));r.push(mirZ(mirX(q,p.x),p.z));}});
      items.push({id:el.id,zone:zr.id,kind:'el',F:r});
    });
    parts.push({id:zr.id,zone:zr.id,kind:'zone',F:bodyF},...items);
    F=Fz.concat(bodyF,...items.map(q=>q.F));setCtx(null);
  });
  return{F,box,parts};
}
/* la facade : la meme scene 3D, vue par une camera oblique (x + K z, y + M z). Le tampon de profondeur fait le travail que le
   peintre ne savait pas faire : corps qui se recouvrent, noues, pignons qui traversent un toit. Les poignees restent en SVG. */
function buildParts(m){
  const{parts}=modelFaces(m),pal=palette(),root=new T.Group(),list=[],box={},acc=css('--accent');
  parts.forEach(pt=>{
    const by={};
    pt.F.forEach(f=>{const k=MATKEY[f.c];if(!k)return;const a=by[k]||(by[k]=[]);faceTris(f.p).forEach(t=>t.forEach(q=>a.push(q[0],q[1],q[2])));});
    const g=new T.Group(),mats=[],edges=new T.Group();edges.visible=false;
    Object.keys(by).forEach(k=>{
      const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(by[k],3));geo.computeVertexNormals();
      const mat=new T.MeshLambertMaterial({color:pal[k],side:T.DoubleSide});mats.push(mat);
      const mesh=new T.Mesh(geo,mat);mesh.frustumCulled=false;g.add(mesh);
      const ln=new T.LineSegments(new T.EdgesGeometry(geo,28),new T.LineBasicMaterial({color:acc}));ln.frustumCulled=false;edges.add(ln);
    });
    g.add(edges);g.userData={pid:pt.id,kind:pt.kind,zone:pt.zone,mats,edges};
    let b=[1e9,1e9,-1e9,-1e9];
    pt.F.forEach(f=>f.p.forEach(q=>{const s2=P(q[0],q[1],q[2]);b=[Math.min(b[0],s2[0]),Math.min(b[1],s2[1]),Math.max(b[2],s2[0]),Math.max(b[3],s2[1])];}));
    box[pt.id]={x:b[0],y:b[1],width:b[2]-b[0],height:b[3]-b[1]};
    root.add(g);list.push(g);
  });
  return{root,list,box};
}
let FACE=null;
function initFace(){
  const cv=document.getElementById('cv-face'),r=new T.WebGLRenderer({canvas:cv,antialias:true}),sc=new T.Scene();
  sc.add(new T.HemisphereLight(0xffffff,0x8a8068,.8));
  const dl=new T.DirectionalLight(0xffffff,.3);dl.position.set(12,22,16);sc.add(dl);
  const g=new T.Mesh(new T.PlaneGeometry(60,24),new T.MeshLambertMaterial({color:css('--ground')}));
  g.rotation.x=-Math.PI/2;g.position.set(10,-.02,-4);g.frustumCulled=false;sc.add(g);
  FACE={r,sc,cam:new T.Camera(),ground:g,parts:null,ray:new T.Raycaster()};
}
function setFaceCam(){
  const W=scene.clientWidth,H=scene.clientHeight,vb=svg.viewBox.baseVal;if(!W||!H)return false;
  const s2=Math.min(W/vb.width,H/vb.height),Wv=W/s2,Hv=H/s2,cx=vb.x+vb.width/2,cy=vb.y+vb.height/2;
  const l=cx-Wv/2,r=cx+Wv/2,ub=-(cy+Hv/2),ut=-(cy-Hv/2),a=2/(r-l),b=2/(ut-ub);
  FACE.r.setPixelRatio(Math.min(devicePixelRatio||1,2));FACE.r.setSize(W,H,false);
  FACE.r.setClearColor(css('--stage'));FACE.ground.material.color.set(css('--ground'));
  FACE.cam.projectionMatrix.set(a,0,-a*K,-2*l/(r-l)-1, 0,b,-b*M,-2*ub/(ut-ub)-1, 0,0,-1/30,0, 0,0,0,1);
  FACE.cam.projectionMatrixInverse.copy(FACE.cam.projectionMatrix).invert();
  return true;
}
function faceScene(){
  if(!FACE)return;
  if(FACE.parts)FACE.sc.remove(FACE.parts.root);
  FACE.parts=buildParts(model);FACE.sc.add(FACE.parts.root);facePaint();
}
function facePaint(){
  if(!FACE||!FACE.parts)return;
  const si=selStepIdx(),apres=ref=>si>=0&&stepIdx(ref)>si,acc=css('--accent'),noir='#000000';
  FACE.parts.list.forEach(g=>{
    const u=g.userData,zn=u.kind==='zone'?zoneOf(u.id):null,on=sel.id?sel.id===u.pid:(u.kind==='zone'&&sel.zone===u.pid),cible=!!(zn&&zn._cible),later=apres(u.pid);
    u.edges.visible=on||cible;
    u.mats.forEach(m=>{m.transparent=later;m.opacity=later?.28:1;m.depthWrite=!later;m.emissive.set(on||cible?acc:noir);m.emissiveIntensity=on||cible?.14:0;m.needsUpdate=true;});
  });
  if(setFaceCam())FACE.r.render(FACE.sc,FACE.cam);
}
function pickFace(ev){
  if(!FACE||!FACE.parts||svg.hasAttribute('hidden'))return null;
  const p=svgPt(ev),sx=p.x,u=-p.y,Z0=40;
  FACE.ray.set(new T.Vector3(sx+K*Z0,u+M*Z0,Z0),new T.Vector3(-K,-M,-1).normalize());
  const hit=FACE.ray.intersectObjects(FACE.parts.root.children,true).find(q=>q.object.isMesh);
  if(!hit)return null;
  let o=hit.object;while(o&&!(o.userData&&o.userData.pid))o=o.parent;
  return o?o.userData:null;
}
// la zone sous le doigt, en face (par la scene) ou en plan (par le DOM)
function zoneAtClient(ev){
  if(faceMode==='face'||sel.id){const pk=pickFace(ev);return pk?pk.zone:null;}
  const t=document.elementFromPoint(ev.clientX,ev.clientY),zn=t&&t.closest&&t.closest('[data-zone]');return zn?zn.dataset.zone:null;
}
function faceTris(pts){
  const v=pts.map(q=>[q[0],q[1],-q[2]]),n=v.length;let nx=0,ny=0,nz=0;
  for(let i=0;i<n;i++){const a=v[i],b=v[(i+1)%n];nx+=(a[1]-b[1])*(a[2]+b[2]);ny+=(a[2]-b[2])*(a[0]+b[0]);nz+=(a[0]-b[0])*(a[1]+b[1]);}
  const ax=Math.abs(nx),ay=Math.abs(ny),az=Math.abs(nz);
  const p2=v.map(a=>ax>=ay&&ax>=az?new T.Vector2(a[1],a[2]):ay>=az?new T.Vector2(a[0],a[2]):new T.Vector2(a[0],a[1]));
  return T.ShapeUtils.triangulateShape(p2,[]).map(t=>[v[t[0]],v[t[1]],v[t[2]]]);
}
// un batiment : un groupe centre sur l'origine, avec sa silhouette (aretes) cachee jusqu'a la selection
function buildGroup(m,id){
  const{F,box}=modelFaces(m),pal=palette(),by={},inner=new T.Group();
  F.forEach(f=>{const k=MATKEY[f.c];if(!k)return;const a=by[k]||(by[k]=[]);faceTris(f.p).forEach(t=>t.forEach(q=>a.push(q[0],q[1],q[2])));});
  const mats=[],edges=new T.Group();edges.visible=false;
  Object.keys(by).forEach(k=>{
    const geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(by[k],3));geo.computeVertexNormals();
    const mat=new T.MeshLambertMaterial({color:pal[k],side:T.DoubleSide});mats.push(mat);
    inner.add(new T.Mesh(geo,mat));
    if(k==='wall'||k==='roof')edges.add(new T.LineSegments(new T.EdgesGeometry(geo,28),new T.LineBasicMaterial({color:css('--accent')})));
  });
  inner.position.set(-(box.x0+box.x1)/2,0,(box.z0+box.z1)/2);inner.add(edges);
  const root=new T.Group();root.userData.id=id;root.add(inner);
  root.userData.setSel=on=>{edges.visible=on;mats.forEach(q=>{q.emissive.set(on?css('--accent'):'#000000');q.emissiveIntensity=on?.16:0;});};
  return root;
}
const VOISINS=[
  {id:'n1',x:-16.5,z:-1,m:{zones:[{id:'v',nom:'Voisin',k:'g',w:8,d:6.5,e:4,shape:'deux-pans',h:2.4,els:[],pig:[],app:[],bow:[]}]}},
  {id:'n2',x:16,z:-3,m:{zones:[{id:'v',nom:'Voisin',k:'g',w:7,d:6,e:3.2,shape:'croupes',h:2,els:[],pig:[],app:[],bow:[]}]}}];
function newScene(kind,m){
  const sc=new T.Scene();sc.background=new T.Color(css('--stage'));
  sc.add(new T.HemisphereLight(0xffffff,0x7a705c,.62));
  const dl=new T.DirectionalLight(0xffffff,.42);dl.position.set(12,22,16);sc.add(dl);
  const g=new T.Mesh(new T.PlaneGeometry(240,240),new T.MeshLambertMaterial({color:css('--ground')}));g.rotation.x=-Math.PI/2;g.position.y=-.02;sc.add(g);
  const self=buildGroup(m,'self');sc.add(self);const roots={self};
  if(kind==='parcel'){
    const pts=[[-11,5],[11,5],[11,-12],[-11,-12]].map(q=>new T.Vector3(q[0],.03,q[1]));
    sc.add(new T.LineLoop(new T.BufferGeometry().setFromPoints(pts),new T.LineBasicMaterial({color:css('--ink-soft')})));
    VOISINS.forEach(v=>{const r=buildGroup(JSON.parse(JSON.stringify(v.m)),v.id);r.position.set(v.x,0,v.z);sc.add(r);roots[v.id]=r;});
  }
  return{sc,roots,self};
}
function rendu(kind){return new T.WebGLRenderer({canvas:document.getElementById(kind),antialias:true});}

/* main : le terrain (A) et la vignette en grand (C), un seul canevas, un seul orbite */
let main=null, mini=null, camMode='3d', sel3d=null, hint3On=true, miniDirty=false;
const app=document.getElementById('app'), vue3d=document.getElementById('vue3d'), miniEl=document.getElementById('mini');
function initMain(){
  const r=rendu('cv-main'),cam=new T.PerspectiveCamera(42,1,.1,400),ctl=new T.OrbitControls(cam,r.domElement);
  ctl.enablePan=false;ctl.minDistance=10;ctl.maxDistance=70;ctl.maxPolarAngle=Math.PI/2-.04;
  ctl.addEventListener('change',()=>{drawMain();placeHint3();});
  main={r,cam,ctl,s:null,ray:new T.Raycaster()};
  const cv=r.domElement;let down=null;
  cv.addEventListener('pointerdown',ev=>{hint3On=false;down={x:ev.clientX,y:ev.clientY};placeHint3();});
  cv.addEventListener('pointerup',ev=>{
    if(!down||view!=='a')return;const d=Math.hypot(ev.clientX-down.x,ev.clientY-down.y);down=null;if(d>6)return;
    const b=cv.getBoundingClientRect(),n=new T.Vector2((ev.clientX-b.left)/b.width*2-1,-((ev.clientY-b.top)/b.height)*2+1);
    main.ray.setFromCamera(n,main.cam);
    const hit=main.ray.intersectObjects(main.s.sc.children,true).find(q=>q.object.isMesh);
    let id=null;if(hit){let o=hit.object;while(o&&!(o.userData&&o.userData.id))o=o.parent;id=o?o.userData.id:null;}
    choisir3d(id);
  });
  new ResizeObserver(sizeMain).observe(vue3d);
}
function drawMain(){if(main&&main.s)main.r.render(main.s.sc,main.cam);}
function sizeMain(){
  if(!main)return;const w=vue3d.clientWidth,h=vue3d.clientHeight;if(!w||!h)return;
  main.r.setPixelRatio(Math.min(devicePixelRatio||1,2));main.r.setSize(w,h,false);main.cam.aspect=w/h;main.cam.updateProjectionMatrix();drawMain();placeHint3();
}
function preset(mode){
  if(!main)return;camMode=mode;const a=main.cam.aspect,k=a<1?1/Math.max(.5,a*1.1):1;
  if(mode==='top')main.cam.position.set(0,25*k,-2.2);else main.cam.position.set(9*k,12*k,24*k);
  main.ctl.target.set(0,2,mode==='top'?-3:-1);main.ctl.update();
  document.getElementById('v-top').setAttribute('aria-pressed',String(mode==='top'));
  document.getElementById('v-3d').setAttribute('aria-pressed',String(mode!=='top'));
  drawMain();placeHint3();
}
function buildMain(){
  if(!main)return;main.s=view==='a'?newScene('parcel',JSON.parse(committedStr)):newScene('solo',model);
  if(view==='a')choisir3d(sel3d,true);
}
function choisir3d(id,silencieux){
  sel3d=id;
  if(main&&main.s)Object.keys(main.s.roots).forEach(k=>main.s.roots[k].userData.setSel(k===id));
  const ab=document.getElementById('abar');
  if(!id||view!=='a')ab.hidden=true;
  else{ab.hidden=false;ab.innerHTML=id==='self'
    ?'<button id="a-edit" aria-label="Modifier la façade"><svg class="i"><use href="#i-pencil"/></svg>Modifier</button>'
    :'<button disabled aria-label="Maison voisine, non modifiable" title="Maison voisine, non modifiable"><svg class="i"><use href="#i-lock"/></svg></button>';
    const b=document.getElementById('a-edit');if(b)b.addEventListener('click',entrerFacade);}
  if(!silencieux){hint3On=false;placeHint3();}
  drawMain();
}
function placeHint3(){
  const h=document.getElementById('hint3');
  if(!main||view!=='a'||!hint3On||sel3d){h.hidden=true;return;}
  const v=new T.Vector3(0,5.2,-.2).project(main.cam);
  h.style.left=((v.x+1)/2*vue3d.clientWidth)+'px';h.style.top=((1-v.y)/2*vue3d.clientHeight)+'px';h.hidden=false;
}
document.getElementById('v-top').addEventListener('click',()=>preset('top'));
document.getElementById('v-3d').addEventListener('click',()=>preset('3d'));

/* vignette : la maison en cours, a chaque geste */
function initMini(){
  const r=rendu('cv-mini'),cam=new T.PerspectiveCamera(38,4/3,.1,300);
  mini={r,cam,s:newScene('solo',model)};
  cam.position.set(13,15,23);cam.lookAt(0,2.4,-2);
  new ResizeObserver(()=>{const w=miniEl.clientWidth,h=miniEl.clientHeight;if(w&&h){r.setPixelRatio(Math.min(devicePixelRatio||1,2));r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();r.render(mini.s.sc,cam);}}).observe(miniEl);
}
function miniUpdate(){
  if(!mini||miniDirty)return;miniDirty=true;
  requestAnimationFrame(()=>{
    miniDirty=false;if(view!=='b')return;
    const old=mini.s.self;mini.s.sc.remove(old);mini.s.self=buildGroup(model,'self');mini.s.sc.add(mini.s.self);
    mini.r.render(mini.s.sc,mini.cam);
  });
}
function rebuild3D(){
  if(mini){mini.s=newScene('solo',model);miniUpdate();}
  buildMain();drawMain();
}
miniEl.addEventListener('click',()=>setView('c'));
miniEl.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setView('c');}});

/* les trois ecrans */
const TITRES={a:['cube','3D'],b:['facade','Façade'],c:['cube','3D']};
function setView(v){
  view=v;app.dataset.view=v;
  document.getElementById('h1-ic').setAttribute('href','#i-'+TITRES[v][0]);document.getElementById('h1-t').textContent=TITRES[v][1];
  if(v==='b'){render();miniUpdate();}
  else{
    if(v==='c'){sel3d=null;document.getElementById('abar').hidden=true;}
    buildMain();
    requestAnimationFrame(()=>{sizeMain();preset(v==='a'?'3d':camMode);});
  }
  placeHint3();
}
function entrerFacade(){
  faceMode='plan';model=JSON.parse(committedStr);sel={zone:'m',id:null};hist=[snap()];hi=0;guides=[];
  setView('b');
}
function ouvrirDlg(){const d=document.getElementById('dlg');d.hidden=false;document.getElementById('d-continue').focus();}
function fermerDlg(){document.getElementById('dlg').hidden=true;}
document.getElementById('d-continue').addEventListener('click',fermerDlg);
document.getElementById('d-abandon').addEventListener('click',()=>{fermerDlg();model=JSON.parse(committedStr);setView('a');});
document.getElementById('b-retour').addEventListener('click',()=>{
  if(view==='c')setView('b');
  else if(view==='b'){if(snap()!==committedStr)ouvrirDlg();else setView('a');}
});
document.getElementById('b-ok').addEventListener('click',()=>{
  committedStr=snap();sel3d='self';setView('a');
  const t=document.getElementById('toast');t.hidden=false;setTimeout(()=>{t.hidden=true;},2200);
});

buildCards();
if(ok3d){initMain();initMini();initFace();setView('a');}
else{document.getElementById('vue3d').insertAdjacentHTML('beforeend','<p style="position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--ink-soft)">La 3D n\u2019est pas disponible ici.</p>');miniEl.hidden=true;}
})();
