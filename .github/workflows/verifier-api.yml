# Verification des requetes du serveur PHP contre la VRAIE API Claude (scripts/verifier-api-claude.mjs).
#
# Manuelle seulement (onglet Actions, « Vérifier l'API Claude », Run workflow) : elle coute quelques
# centimes et demande la cle de test. Jamais sur une PR ni un push : une PR d'un fork n'a pas acces
# aux secrets, et la CI `verifier` ne demande pas le reseau. A lancer avant une livraison
# (CLAUDE.md, circuit d'une modification, point 5).
name: Vérifier l'API Claude

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle à essayer à la place des modèles par défaut du serveur (vide : ceux du serveur)"
        required: false
        default: ""
      plafond:
        description: "Plafond de dépense de la vérification, en dollars (0.25 pour la mesure des façades)"
        required: false
        default: "0.05"
      mesure_facades:
        description: "Mesurer aussi le run d'une façade x1 contre x3 sur les scènes de synthèse du banc (lot F2 ; ~88 requêtes, quelques centimes)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verifier-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PHP et son extension curl
        run: |
          php -v
          php -m | grep -qx curl || { echo "extension curl absente"; exit 1; }
      # La mesure des facades (lot F2) : les dependances et les images de synthese, AVANT que la cle n'entre dans l'environnement
      # (aucun script de paquet ne la voit).
      - name: Preparer la mesure des facades (sans la cle)
        if: ${{ inputs.mesure_facades }}
        run: |
          npm ci --no-audit --no-fund
          npx tsx .claude/skills/facades/scripts/ia-x1-x3.ts --preparer mesure-facades
      - name: Requetes du serveur contre l'API Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}
          MODELE: ${{ inputs.modele }}
          PLAFOND: ${{ inputs.plafond }}
          MESURE: ${{ inputs.mesure_facades }}
        run: |
          set -euo pipefail
          args=(--plafond "$PLAFOND")
          if [ -n "$MODELE" ]; then args+=(--modele "$MODELE"); fi
          if [ "$MESURE" = "true" ]; then args+=(--facades mesure-facades); fi
          node scripts/verifier-api-claude.mjs "${args[@]}"
      - name: Le tableau x1 contre x3 (sans la cle)
        if: ${{ inputs.mesure_facades }}
        run: npx tsx .claude/skills/facades/scripts/ia-x1-x3.ts --evaluer mesure-facades | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Reponses de la mesure des facades
        if: ${{ inputs.mesure_facades }}
        uses: actions/upload-artifact@v4
        with:
          name: mesure-facades-x1-x3
          path: mesure-facades/*.reponses.json
