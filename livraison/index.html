<!-- Le cadre du plan sur telephone et tablette (spec-ihm-mobile §9.2) : un element invisible que la
     feuille de style place entre les barres, encoche comprise. Le plan prend sa taille, mesuree. -->
<div id="zoneCadre" aria-hidden="true"></div>

<!-- Z1, la barre d'application (zones/BarreApplication.tsx) : projet, vues, titre. -->
<div id="zoneBarre"></div>
<!-- Les selecteurs de fichiers des imports (menu Fichier) : caches, declenches par leur commande. -->
<input type="file" id="importSvgFile" accept=".svg,image/svg+xml" style="display:none;">
<input type="file" id="importJsonFile" accept=".json,application/json" style="display:none;">

<!-- Z2, la palette (zones/Palette.tsx), Z3, l'explorateur (zones/Explorateur.tsx), Z4, le canevas
     avec ses commandes en surimpression (zones/Surimpression.tsx), et Z5, l'inspecteur (zones/Inspecteur.tsx). -->
<div id="zoneAtelier">
  <div id="zonePalette"></div>
  <div id="zoneExplorateur"></div>
  <div id="stage">
    <div id="zoneSurimpression"></div>
  </div>
  <div id="zoneInspecteur"></div>
</div>

<!-- La Vue 3D : une vue a part entiere depuis l'etape 3 (app/modes.ts), montree a la place de l'atelier.
     Ses reglages sont regroupes dans #zoneReglages3d : en ligne sur bureau, une feuille sur telephone,
     un panneau sur tablette (spec-ihm-mobile §6.10). L'heure a sa propre barre, posee sur la scene
     sur telephone et tablette. Les identifiants sont ceux d'avant : le code les retrouve par eux. -->
